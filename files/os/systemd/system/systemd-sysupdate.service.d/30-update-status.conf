[Unit]
# Refresh the login banners after every run (bluefin-update-status), so a
# failed check shows on the console and over SSH, not only in the journal;
# the failed run also stays a failed unit.
OnSuccess=bluefin-update-status.service
OnFailure=bluefin-update-status.service
# A check never runs before a boot-counted boot is judged: the update source
# being unreachable must not keep a healthy new image from being blessed.
# boot-complete.target is only queued on counted boots, so elsewhere this
# orders nothing.
After=boot-complete.target
