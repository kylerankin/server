# Writable root slot — Flatcar type GUID (3884dd41-…).
# The writable overlay for the read-only /usr: holds /etc, /var, /home and state.
# Grows to fill the remaining disk. Seeds the offline k0s sysext raw so
# k0s-first-boot.service finds it at /var/lib/k0s/k0s.raw (see issue #134).
[Partition]
Type=3884dd41-8582-4404-b9a8-e9b84f2df50e
Label=ROOT
Format=
GrowFileSystem=yes
CopyFiles=/k0s.raw:/var/lib/k0s/k0s.raw
SizeMinBytes=4G
