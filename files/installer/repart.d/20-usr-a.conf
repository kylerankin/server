# Read-only /usr slot A — Flatcar root-fs type GUID (5dfbf5f4-…).
# systemd-repart copies the OS /usr DDI block-for-block from the embedded
# installer data partition on the boot medium (stamped `bluefin-installer-data`).
# Mounted read-only at runtime via `mount.usr=PARTLABEL=USR-A`.
[Partition]
Type=5dfbf5f4-2848-4bac-aa5e-0d9a20b745a6
Label=USR-A
CopyBlocks=/dev/disk/by-partlabel/bluefin-installer-data
SizeMinBytes=2G
SizeMaxBytes=2G
GrowFileSystem=yes
