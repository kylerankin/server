# Lima template for the Bluefin Server end-to-end installer + boot verification.
#
# The macOS GitHub runner has no native KVM, so QEMU cannot boot the real
# installer image directly. This template enables nested virtualization, which
# exposes /dev/kvm to the Lima guest, letting qemu-system-x86_64 -enable-kvm run
# the installer and the installed target disk at near-native speed.
#
# The e2e job copies the repository into the guest and runs
# .github/scripts/lima-e2e-install-boot.sh there, so every build/boot step
# (BuildStream, podman, QEMU) shares one nested-virt-enabled VM.
#
# Extend the canonical Ubuntu 24.04 cloud-image base so `limactl validate` has
# the required `images` and a resolved arch, and use the standard Lima schema
# (`nestedVirtualization`) rather than the removed `nested` field.
base:
  - template:_images/ubuntu-24.04
cpus: 8
memory: "8GB"
disk: "100G"
nestedVirtualization: true
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      apt-get update
      # qemu-system-x86 (KVM boot), qemu-efi (OVMF), zstd/tar (installer
      # archive + limactl transfer), just (BuildStream wrapper).
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        qemu-system-x86 ovmf just zstd tar
