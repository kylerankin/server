apiVersion: v1
kind: Namespace
metadata:
  name: kubestellar-console
---
apiVersion: v1
kind: Service
metadata:
  name: kubestellar-console
  namespace: kubestellar-console
  labels:
    app.kubernetes.io/name: kubestellar-console
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app.kubernetes.io/name: kubestellar-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubestellar-console
  namespace: kubestellar-console
  labels:
    app.kubernetes.io/name: kubestellar-console
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubestellar-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubestellar-console
    spec:
      serviceAccountName: kubestellar-console
      containers:
      - name: console
        image: ghcr.io/kubestellar/console:v0.3.34
        env:
        - name: DEV_MODE
          value: "true"
        - name: ALLOW_DEV_MODE_IN_CLUSTER
          value: "true"
        - name: DEV_USER_LOGIN
          value: "admin"
        # First-boot fix (#193): on a freshly installed single-node k0s cluster
        # no client kc-agent is connected yet, so the console must read the local
        # embedded k0s API directly instead of defaulting to mock/demo cards.
        # NO_LOCAL_AGENT makes the in-cluster backend serve live cluster state
        # from this pod's ServiceAccount; SKIP_ONBOARDING skips the sign-in flow
        # so the kiosk shows the dashboard immediately.
        - name: SKIP_ONBOARDING
          value: "true"
        - name: NO_LOCAL_AGENT
          value: "true"
        - name: POD_NAMESPACE
          value: "kubestellar-console"
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: kubestellar-console-github-oauth
              key: client-id
              optional: true
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kubestellar-console-github-oauth
              key: client-secret
              optional: true
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: kubestellar-console-github-oauth
              key: jwt-secret
              optional: false
        ports:
        - containerPort: 8080
          name: http
