# Booted from the USB installer (bluefin-server-installer_<ver>.raw), the
# installer UKI starts system-install.target. The medium's ESP carries the
# disk UKI and the repart.d definitions with slot A's UUIDs pinned to this
# image's usrhash; the installer UKI names the disk UKI in
# BLUEFIN_INSTALL_KERNEL (systemd.setenv=).
#
# --erase=yes: the chosen disk is always erased (no keep/erase question); the
# summary and its "yes" confirmation stay as the one safety check.
# --reboot=no + SuccessAction=reboot: sysinstall's own reboot waits for a key
# press, so let the service manager reboot as soon as the install succeeds.
# --set-credential=bluefin.prompt-root-password:1: the installed disk asks for
# a root password on its first boot (bluefin-root-password-prompt.service);
# root ships locked and nothing else would let the new owner log in.
[Unit]
RequiresMountsFor=/run/bluefin/installer
SuccessAction=reboot
FailureAction=halt

[Service]
ExecStart=
ExecStart=systemd-sysinstall --variables=yes --erase=yes --reboot=no --mute-console=yes --definitions=/run/bluefin/installer/bluefin/repart.d --kernel=${BLUEFIN_INSTALL_KERNEL} --set-credential=bluefin.prompt-root-password:1

# On two-NVMe hardware (#308) sysinstall can fail after it starts erasing the
# target, leaving it blank. With --mute-console=yes the error is muted and the
# initrd silences the journal on the console, so the default FailureAction=halt
# stopped at "System halted" with no reason and the RAM log was lost. Run the
# boot-failure diagnostics first: it prints the failed units and sysinstall's
# journal lines to the console (bypassing --mute-console and journald), waits
# bluefin.failure_delay (default 60 s) so it can be read, then halts as before.
# FailureExecStart runs the diagnostics before the halt; FailureAction is
# restated because the base unit sets it and a drop-in cannot inherit it.
FailureExecStart=/usr/libexec/bluefin-boot-diagnostics failure-summary
