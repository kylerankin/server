# OEM slot — Flatcar OEM type GUID (0fc63daf-…).
# Holds cloud-provider metadata / Ignition config. The boot path matches on the
# *filesystem* label, so FSLabel=OEM is set explicitly (Format=ext4).
[Partition]
Type=0fc63daf-8483-4772-8e79-3d69d8477de4
Label=OEM
FSLabel=OEM
Format=ext4
SizeMinBytes=128M
