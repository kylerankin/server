# The homelab CA: a self-signed root for the homelab-ca ClusterIssuer, which
# signs the Gateway's certificate (23-gateway-cert.yaml). Devices trust it
# once (docs/skills/homelab-profile.md, "TLS"); the leaf it signs renews on
# its own. The Secret is in cert-manager's cluster resource namespace, where
# a ClusterIssuer reads it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Bluefin homelab CA
  secretName: homelab-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
    # Keep the key across renewals and re-issues (cert-manager's default is
    # Always since v1.18), so leaves stay valid against the CA devices trust.
    rotationPolicy: Never
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca
spec:
  ca:
    secretName: homelab-ca
