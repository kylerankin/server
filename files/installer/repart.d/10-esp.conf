# EFI System Partition — Flatcar/GPT ESP (type GUID c12a7328-…).
# Created empty by systemd-repart; populated post-install by the installer via
# `bootctl install`, which installs systemd-boot and registers the OS UKI.
[Partition]
Type=esp
Format=vfat
Label=EFI-SYSTEM
SizeMinBytes=500M
SizeMaxBytes=1G
