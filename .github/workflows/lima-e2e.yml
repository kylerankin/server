name: Lima e2e installer and boot verification

# End-to-end installer + boot verification runs on a macOS runner inside a
# nested-virt Lima VM (the runner has no native KVM, so QEMU boots the real
# installer and installed image only inside the guest). Runs on PRs that touch
# the installer/element graph so a broken install or boot is caught before merge.
on:
  pull_request:
    paths:
      - '.github/workflows/lima-e2e.yml'
      - '.github/scripts/lima-e2e-install-boot.sh'
      - '.github/scripts/bluefin-lima-template.yaml'
      - 'elements/installer/**'
      - 'elements/oci/bluefin-server-installer.bst'
      - 'elements/oci/bluefin-server-ddi.bst'
      - 'files/installer/**'
      - 'Justfile'
  push:
    branches: [main]
    paths:
      - '.github/workflows/lima-e2e.yml'
      - '.github/scripts/lima-e2e-install-boot.sh'
      - '.github/scripts/bluefin-lima-template.yaml'
      - 'elements/installer/**'
      - 'elements/oci/bluefin-server-installer.bst'
      - 'elements/oci/bluefin-server-ddi.bst'
      - 'files/installer/**'
      - 'Justfile'
  workflow_dispatch:

# PR-controlled code (the Justfile and e2e script come from the PR head) runs
# here, so the token stays read-only.
permissions:
  contents: read

jobs:
  lima-e2e:
    runs-on: macos-latest
    # Build the DDI installer (BuildStream over the network) and boot it twice
    # under QEMU; allow generous headroom and let the job fail loudly.
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up just
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2
        with:
          tool: just

      - name: Install Lima and QEMU
        run: brew install lima qemu

      - name: Start Lima VM with nested virtualization
        run: |
          # A fresh instance per run; limactl refuses to start a named VM twice.
          limactl stop --force bluefin-server-e2e || true
          cp .github/scripts/bluefin-lima-template.yaml ~/bluefin-lima-template.yaml
          limactl create --name bluefin-server-e2e ~/bluefin-lima-template.yaml
          limactl start bluefin-server-e2e

      - name: Run installer and boot verification
        run: |
          # limactl cp transfers the checkout into the writable guest filesystem,
          # where the whole chain (build + double boot) runs with KVM enabled.
          limactl cp "$PWD" bluefin-server-e2e:/home/ubuntu/repo
          limactl shell bluefin-server-e2e bash -lc 'cd /home/ubuntu/repo && ./.github/scripts/lima-e2e-install-boot.sh'
